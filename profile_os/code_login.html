<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unlock browser workbench</title>
<style>
body { max-width:30rem; margin:4rem auto; padding:0 1rem; font:17px/1.45 system-ui,sans-serif; color:#18212b; }
input,button { display:block; box-sizing:border-box; width:100%; margin-top:.6rem; padding:.7rem; font:inherit; }
.error { color:#9b1c1c; }
</style>
<main>
  <h1>Unlock browser workbench</h1>
  <p>Enter a current code from the existing administrator authenticator. This browser session lasts two hours.</p>
  <!-- ERROR -->
  <form method="post" action="/code/unlock">
    <label>Authenticator code <input name="totp_code" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" autofocus></label>
    <button type="submit">Unlock workbench</button>
  </form>
</main>
